name: BraisenlySwiftDemo
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
packages:
  BraisenlySwiftUI:
    path: ${BRAISENLY_PACKAGE_PATH}
targets:
  BraisenlySwiftDemo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    dependencies:
      - package: BraisenlySwiftUI
        product: BraisenlySwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.BraisenlySwiftDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Braisenly Catalog
  BraisenlySwiftDemo-AI:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    dependencies:
      - package: BraisenlySwiftUI
        product: BraisenlySwiftUI
      - package: BraisenlySwiftUI
        product: BraisenlyAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.BraisenlySwiftDemoAI
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Braisenly Catalog AI
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BRAISENLY_AI"
  BraisenlySwiftDemoTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: BraisenlySwiftDemo
    settings:
      base:
        # xcodegen emits the iOS bundle layout for TEST_HOST; macOS apps keep the executable under Contents/MacOS
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/BraisenlySwiftDemo.app/Contents/MacOS/BraisenlySwiftDemo"
  BraisenlySwiftDemoUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
        excludes: [Fixtures]
      - path: UITests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: BraisenlySwiftDemo
    settings:
      base:
        TEST_TARGET_NAME: BraisenlySwiftDemo
        # XCTestCase overrides nonisolated inits; default MainActor isolation would not compile here
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  BraisenlySwiftDemo:
    build:
      targets:
        BraisenlySwiftDemo: all
        BraisenlySwiftDemoTests: [test]
        BraisenlySwiftDemoUITests: [test]
    test:
      targets: [BraisenlySwiftDemoTests, BraisenlySwiftDemoUITests]
  BraisenlySwiftDemo-AI:
    build:
      targets:
        BraisenlySwiftDemo-AI: all
